# Tool settings only: the back end runs from source (python -m patchbay), it is not installed as a package.

[tool.ruff]
line-length = 120
target-version = "py312"
# app/ and web/ are left from the project template and are not part of Patchbay (see README, Layout).
extend-exclude = ["app", "web", "tests/test_core.py", "tests/test_server.py"]

[tool.ruff.lint]
# pycodestyle errors, pyflakes, bugbear, import order
select = ["E4", "E7", "E9", "F", "B", "I"]

[tool.mypy]
files = ["patchbay"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# -ra lists every skip and expected failure with its reason; --strict-markers refuses a misspelt marker.
# pytest-randomly shuffles the order on every run (replay a run with --randomly-seed=<seed>);
# pytest-timeout fails any test that runs past `timeout` seconds.
# The two --ignore lines keep the project template's web tests out of the run; app/ is not part of Patchbay.
addopts = "-m 'not guest' -ra --strict-markers --ignore=tests/test_core.py --ignore=tests/test_server.py"
timeout = 30
xfail_strict = true
# Unmarked tests are unit tests. Mark the others so the split can be counted (see tests.yml).
markers = [
    "cross: the driver's C core (host build, through ctypes) against the back end's Python device",
    "integration: the back end's server over real sockets, with a scripted vhost-user front end",
    "guest: needs a booted QNX guest; run by scripts/fault_matrix.sh, results in docs/RESULTS.md",
]

[tool.coverage.run]
source = ["patchbay"]
branch = true

[tool.coverage.report]
# The simulated devices and chips decide every answer the drivers get; the CLI entry point is excluded openly.
omit = ["*/patchbay/__main__.py"]
fail_under = 85
show_missing = true

[tool.codespell]
skip = "*.png,*.jpg,*.gif,*.svg,*.lock,package-lock.json,.git,.venv,node_modules,driver/build"
ignore-words-list = "ser,te,nd,nin,anc,busses,dout"
