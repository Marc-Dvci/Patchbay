# On every push: the host side of Patchbay, with no QNX SDP, no guest and no network.
#   C: the driver core built with the host compiler, its unit tests under AddressSanitizer and UBSan.
#   Python: lint, format, strict types, the back end's unit, cross (C core against Python device) and integration
#   tests with coverage, the patch panel in headless Chromium (Playwright, axe-core; a skipped browser test fails the
#   run), and the mutation check of the C core.
#   Shell scripts: shellcheck. Docs: spelling and local links.
# The QNX build itself needs QNX SDP 8.0, which is licensed per developer and cannot be installed here; it is checked
# locally with scripts/build_drivers.sh (see README, "Build and run").
# Read-only: nothing here writes to the repository.
name: tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Chromium for the browser tests
        run: python -m playwright install --with-deps chromium
      - name: axe-core for the accessibility test
        run: |
          npm install --prefix "$RUNNER_TEMP/axe" axe-core@4.10.2
          echo "AXE_JS=$RUNNER_TEMP/axe/node_modules/axe-core/axe.min.js" >> "$GITHUB_ENV"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - name: C unit tests of the driver core, under ASan and UBSan
        run: make -C driver check | tee c-tests.log
      - name: Python tests in random order, with line and branch coverage of the back end
        shell: bash
        run: python -m pytest -q --cov --cov-branch --randomly-seed="$GITHUB_RUN_ID" | tee pytest.log
      - name: No test may be skipped (a missing browser or axe-core would skip the browser tests silently)
        shell: bash
        run: |
          if grep -Eq '[0-9]+ skipped' pytest.log; then grep -E 'SKIPPED|skipped' pytest.log; exit 1; fi
      - name: Mutation check of the C core (each deliberate bug must fail a test)
        run: PYTHON=python bash scripts/mutation_check.sh | tee mutation.log
      - name: Summary on the run page
        if: always()
        shell: bash
        run: |
          count() { python -m pytest --collect-only -q -p no:randomly -m "$1" 2>/dev/null | tail -n 1 | grep -Eo '^[0-9]+' || echo 0; }
          {
            echo "### Tests"
            echo
            echo "| Kind | Tests |"
            echo "|---|---|"
            echo "| Python unit | $(count 'not cross and not integration and not guest') |"
            echo "| Cross (C core against the Python device) | $(count cross) |"
            echo "| Integration (vhost-user over sockets) | $(count integration) |"
            echo "| Browser (patch panel in Chromium, axe-core) | $(count e2e) |"
            echo "| C unit | $(grep -Eo '^[0-9]+ tests' c-tests.log | grep -Eo '[0-9]+' || echo 0) |"
            echo
            grep -E "passed|failed" pytest.log | tail -n 1
            echo
            echo "Random order: replay it with \`python -m pytest --randomly-seed=$GITHUB_RUN_ID\`."
            echo
            echo "### Mutation check"
            echo
            tail -n 1 mutation.log
            echo
            echo "### Coverage of the back end (lines and branches)"
            echo
            python -m coverage report --format=markdown
          } >> "$GITHUB_STEP_SUMMARY"
      - run: shellcheck scripts/*.sh image/*.sh
      - run: codespell
      - run: python scripts/check_links.py
