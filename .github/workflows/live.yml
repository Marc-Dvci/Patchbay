# Not used by Patchbay: there is no hosted demo, the guest runs on the user's own machine. Kept from the project
# template, manual-only, and it exits at once without LIVE_URL. It reads nothing and writes nothing.
name: live
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  LIVE_URL: ""
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Nothing to check
        run: |
          if [ -z "$LIVE_URL" ]; then echo "No LIVE_URL set: Patchbay has no hosted demo."; exit 0; fi
          curl -fsS --retry 3 --retry-delay 20 --max-time 90 "$LIVE_URL/"
