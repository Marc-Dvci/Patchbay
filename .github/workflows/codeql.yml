# Static analysis of the back end (Python), the driver core (C, built for the host) and these workflows. Its runs and
# badge are public; its alerts are visible only to people with write access.
name: codeql
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze:
    # Code scanning needs a public repository (or GitHub Code Security), so this waits until the repository is public.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: actions
            build-mode: none
          - language: c-cpp
            build-mode: manual
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - if: matrix.build-mode == 'manual'
        run: make -C driver host
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
