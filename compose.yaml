# docker compose up demo      the patch panel replaying the recorded session: http://127.0.0.1:8093/
#
# No keys, no QNX, no guest. The port is published on this machine only.
services:
  demo:
    build:
      context: .
      target: demo
    image: "patchbay:demo"
    ports:
      - "127.0.0.1:8093:8093"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
