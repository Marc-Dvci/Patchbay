# io-spi configuration for spi-virtio (format: QNX SPI Framework technote, "Configuring SPI").
# base and irq are mandatory in the format but unused here: the controller is found on PCI and its interrupt comes
# from the PCI server. bs= passes driver options: index of the virtio SPI device, request timeout in milliseconds.
[globals]
verbose=1

[bus]
busno=0
name=spi0
base=0x0
irq=0
input_clock=50000000
bs=index=0,timeout=1000

[dev]
parent_busno=0
devno=0
name=dev0
clock_rate=1000000

[dev]
parent_busno=0
devno=1
name=dev1
clock_rate=1000000
