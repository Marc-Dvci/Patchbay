# io-spi configuration for spi-virtio (format: QNX SPI Framework technote, "Configuring SPI").
# io-spi requires base and irq in every bus section and reads 0 as missing. spi-virtio does not use either: it finds
# the controller on PCI and takes its interrupt from the PCI server, so both hold placeholder values of 1.
# bs= passes the driver's own options: index of the virtio SPI controller, transfer timeout in milliseconds.
[globals]
verbose=1

[bus]
busno=0
name=spi0
base=0x1
irq=1
input_clock=50000000
bs=index=0,timeout=1000

[dev]
parent_busno=0
devno=0
name=dev0
clock_rate=1000000

[dev]
parent_busno=0
devno=1
name=dev1
clock_rate=1000000
