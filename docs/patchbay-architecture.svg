<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560" width="860" height="560" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="15">
  <title>Patchbay architecture</title>
  <desc>QNX's sample programs call the DDK libraries, which call Patchbay's drivers; the drivers talk virtio over PCI to QEMU's vhost-user devices, whose queues are served by the Patchbay back end with simulated chips, faults and the patch panel.</desc>
  <rect width="860" height="560" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#333"/>
    </marker>
  </defs>
  <!-- guest -->
  <rect x="20" y="20" width="400" height="430" rx="8" fill="#eef4fb" stroke="#3b6ea8" stroke-width="2"/>
  <text x="36" y="46" font-weight="700" fill="#1d4a7a">QNX 8.0 guest (QEMU, TCG)</text>
  <rect x="40" y="62" width="360" height="84" rx="4" fill="#fff" stroke="#888"/>
  <text x="54" y="86">QNX samples, unmodified</text>
  <text x="54" y="108" font-size="14" fill="#444">imu-bno055 · temp-humidity-sht3x</text>
  <text x="54" y="130" font-size="14" fill="#444">mcp-3008-joystick · devctl(DCMD_I2C/SPI_*)</text>
  <rect x="40" y="158" width="170" height="62" rx="4" fill="#fff" stroke="#888"/>
  <text x="52" y="182">libi2c-master.a</text>
  <text x="52" y="204" font-size="14" fill="#444">DDK · /dev/i2c1</text>
  <rect x="230" y="158" width="170" height="62" rx="4" fill="#fff" stroke="#888"/>
  <text x="242" y="182">libio-spi.a</text>
  <text x="242" y="204" font-size="14" fill="#444">DDK · /dev/io-spi</text>
  <rect x="40" y="236" width="170" height="44" rx="4" fill="#ffe9d6" stroke="#c0601a" stroke-width="2"/>
  <text x="52" y="264" font-weight="700">i2c-virtio</text>
  <rect x="230" y="236" width="170" height="44" rx="4" fill="#ffe9d6" stroke="#c0601a" stroke-width="2"/>
  <text x="242" y="264" font-weight="700">spi-virtio</text>
  <rect x="40" y="296" width="360" height="100" rx="4" fill="#ffe9d6" stroke="#c0601a" stroke-width="2"/>
  <text x="52" y="320">pb_i2c · pb_spi  request framing</text>
  <text x="52" y="342">pb_vring  split virtqueue, host-tested</text>
  <text x="52" y="364">pb_vpci  libpci, virtio capabilities,</text>
  <text x="52" y="386">INTx pulse thread, deadline and reset</text>
  <text x="40" y="430" font-size="14" fill="#444">PCI 1af4:1062 (I2C, ID 34) · 1af4:106d (SPI, ID 45)</text>
  <line x1="125" y1="146" x2="125" y2="156" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/><line x1="315" y1="146" x2="315" y2="156" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="125" y1="220" x2="125" y2="234" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="315" y1="220" x2="315" y2="234" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <!-- qemu -->
  <rect x="20" y="470" width="820" height="70" rx="8" fill="#f3f3f3" stroke="#666" stroke-width="2"/>
  <text x="36" y="496" font-weight="700">QEMU 11.1.3: vhost-user-i2c-pci, vhost-user-spi-pci</text>
  <text x="36" y="520" font-size="14" fill="#444">guest RAM shared as a memfd · kick and call eventfds · one Unix socket per device</text>
  <line x1="220" y1="450" x2="220" y2="468" stroke="#333" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <!-- host -->
  <rect x="440" y="20" width="400" height="430" rx="8" fill="#eef8f0" stroke="#2f8a4a" stroke-width="2"/>
  <text x="456" y="46" font-weight="700" fill="#1f6534">Linux host or WSL2: python -m patchbay</text>
  <rect x="460" y="62" width="360" height="44" rx="4" fill="#fff" stroke="#888"/>
  <text x="472" y="90">vhost-user back end (server.py)</text>
  <rect x="460" y="122" width="170" height="62" rx="4" fill="#fff" stroke="#888"/>
  <text x="472" y="146">VirtioI2c</text>
  <text x="472" y="168" font-size="14" fill="#444">FAIL_NEXT groups</text>
  <rect x="650" y="122" width="170" height="62" rx="4" fill="#fff" stroke="#888"/>
  <text x="662" y="146">VirtioSpi</text>
  <text x="662" y="168" font-size="14" fill="#444">transfer checks</text>
  <rect x="460" y="200" width="170" height="84" rx="4" fill="#fff8e1" stroke="#b08a00"/>
  <text x="472" y="224">BNO055 @0x28</text>
  <text x="472" y="248">SHT3x @0x44</text>
  <text x="472" y="272" font-size="14" fill="#444">from data sheets</text>
  <rect x="650" y="200" width="170" height="84" rx="4" fill="#fff8e1" stroke="#b08a00"/>
  <text x="662" y="224">MCP3008 cs0</text>
  <text x="662" y="272" font-size="14" fill="#444">bit by bit</text>
  <rect x="460" y="296" width="360" height="56" rx="4" fill="#fde8e8" stroke="#b03030"/>
  <text x="472" y="318">FaultPlan: NAK, unplug, corrupt,</text><text x="472" y="340">stuck bus, delay, controller error</text>
  <rect x="460" y="362" width="360" height="76" rx="4" fill="#fff" stroke="#888"/>
  <text x="472" y="384">control socket ← ctl, fault matrix, panel</text>
  <text x="472" y="406">events (JSON lines) → patch panel</text>
  <text x="472" y="428" font-size="14" fill="#444">127.0.0.1 web page, live or recorded</text>
  <line x1="640" y1="450" x2="640" y2="468" stroke="#333" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
</svg>
